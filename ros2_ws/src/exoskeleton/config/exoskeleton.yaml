#the first one is a wildcard which is universal
/**:
  ros__parameters:
      Quality_of_service: 10

Admittance_Node:
  ros__parameters:
      Virtual_mass: 1.0
      Base_K: 0.1
      Max_K: 5.0
      Controller_update_rate: 0.1
      Range_of_motion: [-100,100]
      ROM_buffer: 15
      Factor_coefficient: 0.5
      Motion_command_topic: "/md/motion_command"
      Torque_estimator: "/Torque_estimator"

Classification_Node:
  ros__parameters:
      ML_Model: '/workspace/src/exoskeleton/ML models/gesture_model.pkl' 
      Update_rate: 0.05
      Confidence_threshold: 0.7
      Subscriber: "/exo/extracted_features"
      Publisher: "/exo/classification"

Feature_extraction_Node:
  ros__parameters:
    Extraction_rate: 0.1
    Wamp_threshold: 1
    ssc_threshold: 1
    Processed_EMG: "/exo/processed_EMG"
    Extracted_features: "/exo/extracted_features"

Read_EMG:
  ros__parameters:
    output_topic: '/exo/raw_EMG'
    read_period: 0.05

