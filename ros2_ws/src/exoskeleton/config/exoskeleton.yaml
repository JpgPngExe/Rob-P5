Signal_Processing:
  ros__parameters:
    input_topic: "/exo/raw_EMG"
    output_topic: "/exo/processed_EMG"
    

Time_synchronizer:
  ros__parameters:
    Queue_size: 10
    Max_delay: 0.005
    EMG_publisher: "/exo/synced_EMG"
    IMU_publisher: "/exo/synced_IMU"
